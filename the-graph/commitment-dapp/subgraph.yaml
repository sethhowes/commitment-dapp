specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CommitMumbaiFunctions
    network: mumbai
    source:
      address: "0x441A3E98C9dB4cf0135b5D5C81f4B8933B179180"
      abi: CommitMumbaiFunctions
      startBlock: 46473141
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferRequested
        - OwnershipTransferred
        - RequestFulfilled
        - RequestSent
        - RunChecked
        - RunCreated
      abis:
        - name: CommitMumbaiFunctions
          file: ./abis/CommitMumbaiFunctions.json
      eventHandlers:
        - event: OwnershipTransferRequested(indexed address,indexed address)
          handler: handleOwnershipTransferRequested
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RequestFulfilled(indexed bytes32)
          handler: handleRequestFulfilled
        - event: RequestSent(indexed bytes32)
          handler: handleRequestSent
        - event: RunChecked(indexed uint256,uint256,uint256,bool)
          handler: handleRunChecked
        - event: RunCreated(indexed uint256,uint256,uint256)
          handler: handleRunCreated
      file: ./src/commit-mumbai-functions.ts
